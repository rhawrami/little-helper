[project]
name = "little-helper"
version = "0.1.0"
description = "Measuring how AI is changing the development of foundational open source software"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "pyyaml>=6.0.3",
    "zstandard>=0.25.0",
]

[project.scripts]
lh = "little_helper.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs internet access (deselect with -m 'not network')"]
