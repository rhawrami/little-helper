# Candidate pool for the pilot sample (crosswalk).
#
# Each entry maps one *project* (the unit of analysis) to its identifier in every
# significance source. A project may span several repos or packages; signals take
# the maximum over the mapped identifiers, never the sum, so splitting a project
# into many packages cannot inflate it.
#
#   github:   owner/repo on GitHub, canonical or mirror (used only to join the
#             OpenSSF Criticality Score and OSS-Fuzz main_repo)
#   debian:   Debian source package names; entries starting with ^ are regexes
#             (versioned sources like gcc-16, postgresql-18)
#   repology: Repology project name
#   docker:   Docker official image (library/<name>)
#   packages: <ecosyste.ms registry>:<package name>
#   ossfuzz:  OSS-Fuzz project name, when main_repo matching is not enough
#
# The pool was nominated from the top of each lens (see docs/sample_selection.md)
# plus deliberate layer coverage; inclusion in this file is NOT inclusion in the
# sample. score_pilot.py applies the rule.

