    states_observable: "PR state is misleading: 222 'merged' vs 16,699 closed. Maintainers rebase or squash locally and push with a 'Closes #N' trailer, which auto-closes the PR. Accepted = referenced by a 'Closes #N' commit; rejected = closed with no such commit."
