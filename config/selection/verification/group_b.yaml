    states_observable: "PRs are never GitHub-merged. The Skara bot pushes the commit after /integrate and closes the PR with label 'integrated' (33,391 closed vs 25 'merged', and those 25 are merge-PRs). Accepted = closed+integrated; rejected or withdrawn = closed without 'integrated'; pending = open. Before 2020-09, rejections are visible only in mailing-list RFR threads."
