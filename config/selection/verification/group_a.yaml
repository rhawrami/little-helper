# "unverified" means the claim was not confirmed against a source in this session.
# Comments starting with "# scope:" qualify an ai_policy entry whose rule covers only part of the project.

- id: linux
  canonical_repo: {url: "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git", vcs: git}
  github: {slug: torvalds/linux, role: official_mirror}   # Torvalds pushes to it; PRs are disabled (API 404)
  history_start: {date: 2005-04-16, note: "Root commit 1da177e4c3f4 'Linux-2.6.12-rc2'. Nothing earlier was imported. BitKeeper-era history (2002-2005) is only in separate 'history' repos, and pre-2002 history only in tarball-reconstructed repos. The master branch holds about 1.5M commits including merges."}
  review:
    current: {type: "email to LKML plus subsystem lists; some subsystems run patchwork.kernel.org; archived on lore.kernel.org", url: "https://lore.kernel.org", since: "early 1990s (email patches since the project began; exact year unverified)"}
    past: [{type: "BitKeeper pulls (this was the VCS, not a review venue; patches were still emailed)", url: "n/a", until: 2005-04}]
    states_observable: "No project-wide accept/reject state exists. Subsystems that use patchwork set states (New/Under Review/Accepted/Rejected/Changes Requested/Superseded/RFC/Not Applicable/Awaiting Upstream/Deferred), but inconsistently. Otherwise a patch counts as accepted when it matches a mainline or linux-next commit (Link:/Message-ID, patch-id or subject), and rejected vs pending has to be inferred from NAKs and thread inactivity."
    access: "lore.kernel.org public-inbox archives (git-cloneable, mbox/Atom, lei/b4); patchwork.kernel.org REST API (/api/); full git history"
  issues:
    current: {type: "mailing lists per MAINTAINERS (primary); bugzilla.kernel.org used by only a few subsystems; regzbot for regressions", url: "https://bugzilla.kernel.org", since: "Bugzilla 2002-11 (bug #1 created 2002-11-06)"}
    past: []
    access: "Bugzilla REST API (/rest/bug; needs a search term; bugs past #222,000 by 2026-11); lore archives"
  license: {spdx: "GPL-2.0-only WITH Linux-syscall-note", changes: [{date: "1992 (v0.12)", from: "custom license barring commercial redistribution (0.01-0.11)", to: "GPL-2.0"}, {date: unverified, from: "GPL-2.0 (version not pinned)", to: "GPL-2.0-only (explicit v2-only note in COPYING)"}]}
  governance: "Linus Torvalds has final say over mainline; Greg Kroah-Hartman runs stable. Hierarchical subsystem maintainers. Torvalds and GKH are Linux Foundation fellows. LF Technical Advisory Board; yearly Maintainers Summit."
  ai_policy: {status: conditions, date: 2026-02-22, url: "https://docs.kernel.org/process/coding-assistants.html"}
  # scope: Documentation/process/coding-assistants.rst (commit 78d979db6cef, Sasha Levin, committed to the docs tree 2026-01-06; in mainline at 7.0-rc1 on 2026-02-22; released in 7.0 on 2026-04-12).
  # generated-content.rst (Dave Hansen, a66437c27979, 2026-01-20) asks for transparency about tool use. Rules: humans only sign the DCO, and the human takes responsibility.
  # The Assisted-by tag was REMOVED in 7.4-rc1 (commit 1e035297ffda, 2026-10-14, after the Maintainers Summit consensus). Disclosure now belongs in the cover letter.
  notes: "Assisted-by trailers are only valid from about 2026-02 to 2026-10. The removal commit says roughly 10% of 18,533 non-merge 7.3 commits carried the tag, but LLM use was far wider, so counts are a floor. Patches flow from maintainer trees through linux-next to mainline via signed-tag pull merges, which means many merge commits and author dates that are far older than commit dates. Stable/LTS lives in a separate repo (stable/linux.git) with backport duplicates ('commit X upstream'). Signed-off-by chains (DCO), Co-developed-by, Reviewed/Acked/Tested/Reported-by, Link:/Closes: trailers. DRM and a few other subsystems use gitlab.freedesktop.org for issues. AI-found security fixes surged in 2026 (see the maintainer_burden note)."
  confidence: high
  sources: ["https://docs.kernel.org/process/coding-assistants.html", "https://docs.kernel.org/7.1/_sources/process/coding-assistants.rst.txt", "https://github.com/torvalds/linux/commit/1e035297ffda", "https://github.com/torvalds/linux/commit/78d979db6cef", "https://www.theregister.com/ai-and-ml/2026/10/14/linux-kernel-devs-drop_obligatory_confession_of_ai_tool_usage/5303140", "https://docs.kernel.org/admin-guide/reporting-issues.html", "https://bugzilla.kernel.org/rest/bug?id=1", "https://patchwork.kernel.org/api/projects/"]

